#Gradle
org.gradle.jvmargs=-Xmx8G -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=./build/heapdump.hprof -Dfile.encoding=UTF-8
org.gradle.workers.max=4
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.daemon=true
org.gradle.parallel=true
#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx8G
kotlin.native.binary.gc=cms
kotlin.incremental.wasm=true
# Reduce native compiler memory footprint (can slow builds slightly)
kotlin.native.disableCompilerDaemon=true
#Android
android.useAndroidX=true
android.nonTransitiveRClass=true
#Compose
org.jetbrains.compose.experimental.jscanvas.enabled=true
org.jetbrains.compose.experimental.macos.enabled=true

# Library version used for Maven coordinates (update when tagging releases)
hummingVersion=1.0.0

# Memory tuning notes:
# - Increase -Xmx further if builds still OOM (e.g. 8G).
# - Lower org.gradle.workers.max if parallel native compilation spikes memory.
